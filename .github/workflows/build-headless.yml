name: Build headless render

on:
  workflow_dispatch:
  push:
    branches: [headless-render]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build g++ \
            extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools qt6-base-private-dev qt6-webengine-dev \
            qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-5compat-dev \
            libkf6archive-dev libkf6i18n-dev libssl-dev \
            libxkbcommon-dev libxcb-util-dev libcups2-dev \
            libqt6sql6-sqlite dbus-x11 gdb file

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Headless render smoke test
        env:
          # 容器无显示、user namespace 受限：禁沙箱走 offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          FALCON_BIN=$(find build -type f -name falkon -perm -u+x | head -1)
          if [ -z "$FALCON_BIN" ]; then
            echo "falcon binary not found, candidates:"
            find build -type f \( -name 'falcon*' -o -name 'run.sh' \) | head -20
            ls build/bin 2>/dev/null || true
            exit 1
          fi
          echo "using $FALCON_BIN"
          gdb -batch -ex run -ex 'thread apply all bt 25' -ex quit \
            --args "$FALCON_BIN" --headless-render \
            "data:text/html,<h1 style='color:#3494d9'>Falkon Headless OK</h1>" \
            --headless-output smoke.png \
            --headless-width 800 --headless-height 400 \
            --headless-timeout 60000 || true
          test -s smoke.png
          # 校验 grab 结果非全透明（像素含不透明分量才算渲染成功）
          python3 - <<'PY'
import struct, zlib, sys
d = open('smoke.png','rb').read()
w, h = struct.unpack('>II', d[16:24])
chunks, i = [], 8
while i < len(d):
    ln, typ = struct.unpack('>I4s', d[i:i+8])
    if typ == b'IDAT':
        chunks.append(d[i+8:i+8+ln])
    i += 12 + ln
raw = zlib.decompress(b''.join(chunks))
stride = w*4+1
opaque = 0
for row in range(h):
    line = raw[row*stride+1: row*stride+w*4+1]
    for px in range(3, len(line), 4):
        if line[px] != 0:
            opaque += 1
print(f'{w}x{h}, opaque pixels: {opaque}')
sys.exit(0 if opaque > w*h//100 else 1)
PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: falkon-headless-build
          path: |
            build/**/falkon
            smoke.png
          if-no-files-found: error
