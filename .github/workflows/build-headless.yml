name: Build headless render

on:
  workflow_dispatch:
  push:
    branches: [headless-render]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build g++ \
            extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools qt6-base-private-dev qt6-webengine-dev \
            qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-5compat-dev \
            libkf6archive-dev libkf6i18n-dev libssl-dev \
            libxkbcommon-dev libxcb-util-dev libcups2-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Headless render smoke test
        env:
          # 容器无显示、user namespace 受限：禁沙箱走 offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --single-process"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          FALCON_BIN=$(find build -maxdepth 3 -type f -name falcon -perm -u+x | head -1)
          test -n "$FALCON_BIN"
          "$FALCON_BIN" --headless-render \
            "data:text/html,<h1 style='color:#3494d9'>Falkon Headless OK</h1>" \
            --headless-output smoke.png \
            --headless-width 800 --headless-height 400 \
            --headless-timeout 60000
          test -s smoke.png
          file smoke.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: falkon-headless-build
          path: |
            build/**/falcon
            smoke.png
          if-no-files-found: error
